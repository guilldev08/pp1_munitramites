services:
  web:
    build: .
    # Se levanta solo si Docker Desktop se reinicia o se cae la PC
    restart: unless-stopped
    # Asistente: Groq (API en la nube, compatible con OpenAI). La clave
    # se pega en el .env de esta carpeta (GROQ_API_KEY=gsk_...) y se
    # aplica con `docker compose up -d web`. Sin clave, el asistente
    # contesta con la plantilla local y nunca se queda mudo.
    environment:
      CHATBOT_LLM: ${CHATBOT_LLM:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELO: ${GROQ_MODELO:-openai/gpt-oss-120b}
      GROQ_TIMEOUT: ${GROQ_TIMEOUT:-30}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      firebird:
        condition: service_healthy
    # Espera activa a que Firebird acepte conexiones antes de migrar
    command: >
      sh -c "for i in $$(seq 1 60); do
        python -c \"import socket; socket.create_connection(('firebird',3050),2).close()\" && break;
        sleep 2;
      done;
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"

  firebird:
    # Imagen oficial de Firebird (jacobalberty/firebird quedó archivada)
    image: firebirdsql/firebird:4.0.7
    # Se levanta sola si Docker Desktop se reinicia o se cae la PC
    restart: unless-stopped
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: munitramites.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    ports:
      - "3050:3050"
    volumes:
      - firebird_data:/var/lib/firebird/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':>/dev/tcp/127.0.0.1/3050' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  firebird_data:
