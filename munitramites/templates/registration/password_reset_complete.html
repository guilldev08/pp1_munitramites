{% extends "base.html" %}

{% block titulo %}Contraseña actualizada · Munitramites{% endblock %}

{% block contenido %}
<section class="seccion">
  <div class="contenedor">
    <div class="panel" style="max-width:520px; margin:0 auto">
      <h2 class="mt-0">Contraseña actualizada</h2>
      <p class="texto-suave">Tu contraseña nueva ya está activa. Ingresá con ella.</p>
      <p class="centrado">
        <a class="boton" href="{% url 'login' %}" data-abrir="modal-auth" data-tab="login">Iniciar sesión</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
